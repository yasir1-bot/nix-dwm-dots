# picom — the compositor. Started once from desktop.nix. Docs: man picom / github.com/yshui/picom
#
# If the screen is black/flickers (some VMs, old GPUs): change backend to "xrender" and
# comment out the blur section. Everything else keeps working.

backend = "glx";
vsync = true;
use-damage = true;

# --- Shadows: subtle, none on the bar or menus ---
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'dwm'",
  "window_type = 'dock'",
  "window_type = 'dnd'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

# --- Fading: a short, quiet fade when windows open/close ---
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# --- Transparency ---
# st's WM_CLASS is "st-256color". 0.88 = 88% opaque (text becomes slightly translucent too;
# this is the trade-off of not patching st for background-only alpha).
opacity-rule = [
  "88:class_g = 'st-256color'"
];
# The dwm bar and dmenu are transparent by themselves (alpha patch) — picom only composes them.

# --- Blur behind translucent windows (bar, dmenu, terminal) ---
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "_GTK_FRAME_EXTENTS@:c"     # avoids blur artefacts around client-side-decorated GTK windows
];

# --- Misc ---
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;

wintypes: {
  tooltip       = { fade = true; shadow = false; opacity = 0.95; };
  dock          = { shadow = false; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
